name: Refresh UFC Odds

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET daily (13:00 UTC)
    - cron: '0 19 * * *'   # 3 PM ET daily (19:00 UTC)
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch odds and detect new card
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
        run: |
          python - <<'EOF'
          import json, time, requests, os
          from datetime import datetime
          from pathlib import Path

          SHARP_API_KEY = os.environ["SHARP_API_KEY"]
          SHARP_BASE    = "https://api.sharpapi.io/api/v1"
          PREDICTIONS   = Path("card_predictions.json")
          headers       = {"X-API-Key": SHARP_API_KEY}

          # Step 1: Fetch upcoming UFC events
          r = requests.get(f"{SHARP_BASE}/events",
                           params={"sport":"mma","league":"ufc","limit":50},
                           headers=headers, timeout=10)
          print(f"Events status: {r.status_code}")
          if not r.ok:
              print("SharpAPI unavailable")
              exit(0)

          sharp_events = r.json().get("data", [])
          print(f"Found {len(sharp_events)} UFC events")

          # Step 2: Fetch odds for each event
          sharp_cards = {}
          odds_map = {}

          for ev in sharp_events[:25]:
              try:
                  r2 = requests.get(
                      f"{SHARP_BASE}/events/{ev['id']}/odds",
                      params={"market":"moneyline","odds_format":"american"},
                      headers=headers, timeout=10
                  )
                  if not r2.ok: continue
                  outcomes = r2.json().get("data", [])

                  fighter_odds = {}
                  fighter_names = {}
                  for o in outcomes:
                      full = (o.get("name") or o.get("team") or "").strip()
                      last = full.split()[-1].lower() if full else ""
                      price = o.get("odds_american") or o.get("price")
                      if last and price is not None:
                          if last not in fighter_odds or float(price) > fighter_odds[last]:
                              fighter_odds[last] = float(price)
                              fighter_names[last] = full

                  for n1 in fighter_odds:
                      for n2 in fighter_odds:
                          if n1 != n2:
                              odds_map[(n1,n2)] = (fighter_odds[n1], fighter_odds[n2])

                  fights = []
                  lasts = list(fighter_odds.keys())
                  for i in range(0, len(lasts)-1, 2):
                      l1, l2 = lasts[i], lasts[i+1]
                      fights.append({
                          "fighter1": fighter_names[l1], "fighter2": fighter_names[l2],
                          "odds1": round(fighter_odds[l1]), "odds2": round(fighter_odds[l2])
                      })

                  if fights:
                      ev_name = ev.get("name") or ev.get("title") or f"UFC Event {ev['id']}"
                      sharp_cards[ev["id"]] = {"name": ev_name, "date": ev.get("start_date",""), "fights": fights}

                  time.sleep(0.5)
              except Exception as e:
                  print(f"  Event error: {e}")
                  continue

          print(f"Fetched {len(sharp_cards)} events, {len(odds_map)//2} matchups")

          # Step 3: Load existing predictions
          if PREDICTIONS.exists():
              with open(PREDICTIONS) as f:
                  data = json.load(f)
          else:
              data = []

          # Step 4: Update existing card odds
          updated = 0
          for event in data:
              for bout in event.get("bouts", []):
                  l1 = bout["fighter1"].split()[-1].lower()
                  l2 = bout["fighter2"].split()[-1].lower()
                  entry = odds_map.get((l1,l2))
                  if entry:
                      bout["odds1"] = round(entry[0])
                      bout["odds2"] = round(entry[1])
                      bout["live_odds"] = True
                      bout["odds_updated_at"] = datetime.utcnow().isoformat() + "Z"
                      updated += 1
                  else:
                      bout["live_odds"] = False
              event["odds_refreshed_at"] = datetime.utcnow().isoformat() + "Z"
          print(f"Updated {updated} fights in existing card")

          # Step 5: Detect new card
          existing_names = {e.get("event","").lower().strip() for e in data}
          new_added = 0

          for ev_id, card in sharp_cards.items():
              name_lower = card["name"].lower().strip()
              if any(name_lower in ex or ex in name_lower for ex in existing_names):
                  continue
              if not card["fights"]:
                  continue

              print(f"NEW CARD: {card['name']} ({len(card['fights'])} fights)")
              bouts = []
              for fight in card["fights"]:
                  o1, o2 = fight["odds1"], fight["odds2"]
                  m1 = round(100/(o1+100)*100 if o1>0 else abs(o1)/(abs(o1)+100)*100, 1)
                  bouts.append({
                      "fighter1": fight["fighter1"], "fighter2": fight["fighter2"],
                      "weight_class": "",
                      "odds1": o1, "odds2": o2,
                      "prob1": None, "prob2": None,
                      "mkt_prob1": m1, "mkt_prob2": round(100-m1,1),
                      "edge1": None, "edge2": None,
                      "bet_on": None, "bet_odds": None,
                      "within_cap": False, "verdict": "PENDING",
                      "model_found": False, "main_card": True,
                      "live_odds": True,
                      "odds_updated_at": datetime.utcnow().isoformat() + "Z",
                      "predictions_pending": True
                  })

              data = [{
                  "event": card["name"], "date": card["date"],
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "backtest": data[0].get("backtest") if data else {},
                  "predictions_pending": True,
                  "odds_refreshed_at": datetime.utcnow().isoformat() + "Z",
                  "bouts": bouts
              }]
              new_added += 1
              break  # one new card at a time

          if not new_added:
              print("No new cards detected")

          # Step 6: Save
          with open(PREDICTIONS, "w") as f:
              json.dump(data, f, indent=2)
          print("Saved card_predictions.json")
          EOF

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add card_predictions.json
          git diff --staged --quiet || git commit -m "Auto odds refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
