<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UFC Edge Analyzer</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #141414;
      --bg3: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0;
      --text2: #888;
      --text3: #555;
      --green: #4ade80;
      --green-bg: rgba(74,222,128,0.1);
      --red: #f87171;
      --red-bg: rgba(248,113,113,0.1);
      --blue: #60a5fa;
      --blue-bg: rgba(96,165,250,0.1);
      --amber: #fbbf24;
      --amber-bg: rgba(251,191,36,0.1);
      --radius: 10px;
      --radius-sm: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .header-sub { font-size: 12px; color: var(--text2); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 600; }
    .stat-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .amber { color: var(--amber); }
    .event-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .event-name { font-size: 15px; font-weight: 600; }
    .event-meta { font-size: 11px; color: var(--text2); }
    .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
    .section-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 16px; background: var(--bg3); border-bottom: 0.5px solid var(--border); }
    .fight { border-bottom: 0.5px solid var(--border); }
    .fight:last-child { border-bottom: none; }
    .fight-main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px 10px; gap: 12px; }
    .fighter { display: flex; flex-direction: column; gap: 3px; }
    .fighter.right { align-items: flex-end; text-align: right; }
    .fighter-name { font-size: 14px; font-weight: 600; }
    .fighter-odds { font-size: 12px; color: var(--text2); }
    .fighter-prob-model { font-size: 12px; font-weight: 600; }
    .fighter-prob-mkt { font-size: 11px; color: var(--text3); }
    .fight-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .weight-class { font-size: 10px; color: var(--text3); }
    .bar { width: 88px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
    .verdict-pill { font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    .pill-bet-dog { background: var(--green-bg); color: var(--green); border: 0.5px solid rgba(74,222,128,0.3); }
    .pill-bet-fav { background: var(--blue-bg); color: var(--blue); border: 0.5px solid rgba(96,165,250,0.3); }
    .pill-cap { background: var(--amber-bg); color: var(--amber); border: 0.5px solid rgba(251,191,36,0.3); }
    .pill-disagree { background: rgba(251,191,36,0.15); color: #f59e0b; border: 0.5px solid rgba(251,191,36,0.4); }
    .pill-intrigued { background: rgba(234,179,8,0.10); color: #ca8a04; border: 0.5px solid rgba(234,179,8,0.3); }
    .pill-pass { background: transparent; color: var(--text3); border: 0.5px solid var(--border); }
    .pill-pending { background: rgba(251,191,36,0.1); color: var(--amber); border: 0.5px solid rgba(251,191,36,0.3); }
    .pending-banner { background: rgba(251,191,36,0.08); border: 0.5px solid rgba(251,191,36,0.3); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--amber); }
    .pending-banner strong { font-weight: 600; }
    .edge-strip { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 0.5px solid var(--border); }
    .edge-cell { padding: 8px 16px; }
    .edge-cell:not(:last-child) { border-right: 0.5px solid var(--border); }
    .edge-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
    .edge-val { font-size: 12px; font-weight: 600; }
    .odds-edit { display: none; padding: 10px 16px; background: var(--bg3); border-top: 0.5px solid var(--border); align-items: center; gap: 8px; flex-wrap: wrap; }
    .odds-edit.open { display: flex; }
    .odds-edit label { font-size: 11px; color: var(--text2); }
    .odds-edit input { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 12px; padding: 5px 8px; width: 72px; outline: none; }
    .odds-edit input:focus { border-color: var(--blue); }
    .odds-edit button { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); cursor: pointer; font-size: 11px; padding: 5px 12px; }
    .odds-edit button:hover { border-color: var(--blue); color: var(--blue); }
    .edit-toggle { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 10px; padding: 0 16px 10px; text-decoration: underline; text-underline-offset: 2px; display: block; }
    .edit-toggle:hover { color: var(--text2); }
    .footer-note { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 12px; color: var(--text2); margin-top: 4px; }
    .footer-note strong { color: var(--text); }
    .loading { text-align: center; padding: 4rem 1rem; color: var(--text2); }
    .dot { display: inline-block; animation: blink 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
    .live-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--green); background: var(--green-bg); border: 0.5px solid rgba(74,222,128,0.3); border-radius: 99px; padding: 2px 8px; }
    .live-dot { width: 5px; height: 5px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .refresh-btn { background: none; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; font-size: 11px; padding: 4px 10px; }
    .refresh-btn:hover { color: var(--text); border-color: var(--text2); }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .fight-main { padding: 12px 12px 8px; gap: 8px; }
      .bar { width: 60px; }
      .edge-strip { grid-template-columns: repeat(2, 1fr); }
      .edge-cell:nth-child(2) { border-right: none; }
    }

    .parlay-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 4px; }
    .parlay-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .parlay-tag { background: rgba(251,191,36,0.15); color: var(--amber); border: 0.5px solid rgba(251,191,36,0.3); border-radius: 99px; font-size: 10px; padding: 2px 8px; }
    .parlay-legs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .parlay-leg { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .parlay-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 0.5px solid var(--border); padding-top: 10px; }
    .parlay-stat-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
    .parlay-stat-val { font-size: 13px; font-weight: 700; color: var(--green); }
    .parlay-disclaimer { font-size: 10px; color: var(--text3); margin-top: 8px; text-align: center; }

    .how-it-works-wrap { margin-bottom: 12px; }
    .how-it-works-btn { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; width: 100%; text-align: left; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
    .how-it-works { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 4px; }
    .how-it-works p { font-size: 12px; color: var(--text2); margin: 0 0 8px 0; line-height: 1.5; }
    .how-it-works p:last-child { margin-bottom: 0; }
    .info-btn { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; padding: 0 4px; vertical-align: middle; }
    .info-btn:hover { color: var(--text); }
    .fight-info-panel { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 4px; font-size: 12px; color: var(--text2); line-height: 1.5; }
    .fight-info-bottom { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--border); font-size: 11px; color: var(--text3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>UFC Edge Analyzer</h1>
        <div class="header-sub">4% edge · model vs market · Cards added as they come out</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span id="last-updated" style="font-size:11px;color:var(--text3);margin-right:6px;"></span><span class="live-badge" id="live-badge" style="display:none"><span class="live-dot"></span>live odds</span>
        <button class="refresh-btn" onclick="loadAll()">↻ refresh</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Backtest ROI</div>
        <div class="stat-value green" id="s-roi">+72.1%</div>
        <div class="stat-sub">>=4% edge · opening lines</div>
      </div>
      <div class="stat">
        <div class="stat-label">Win rate</div>
        <div class="stat-value" id="s-wr">58.0%</div>
        <div class="stat-sub" id="s-bets">839 bets / 1254 fights</div>
      </div>
      <div class="stat">
        <div class="stat-label">Fav ROI</div>
        <div class="stat-value green" id="s-fav">—</div>
        <div class="stat-sub">favs within cap</div>
      </div>
      <div class="stat">
        <div class="stat-label">Dog ROI</div>
        <div class="stat-value green" id="s-dog">—</div>
        <div class="stat-sub">dogs within cap</div>
      </div>
    </div>

    <div id="root">
      <div class="loading">
        <span class="dot">●</span> <span class="dot">●</span> <span class="dot">●</span>
        <br><br>Loading card predictions...
      </div>
    </div>
  </div>

  <script>
    const PREDICTIONS_URL = 'card_predictions.json';
    const ODDS_API_KEY = '607a8a2924939354eaa7515d34ac762e';
    const ODDS_API_BASE = 'https://api.the-odds-api.com/v4';

    let state = [];
    let currentEvent = '';
    let currentDate = '';
    let currentBacktest = {};
    let liveOdds = {};

    function imp(o) { return o > 0 ? 100/(o+100) : Math.abs(o)/(Math.abs(o)+100); }
    function oddsStr(o) { return (o > 0 ? '+' : '') + Math.round(o); }
    function evStr(prob, odds) {
      const pay = odds > 0 ? odds/100 : 100/Math.abs(odds);
      const ev = (prob/100 * pay - (1 - prob/100)) * 100;
      return (ev > 0 ? '+' : '') + '$' + ev.toFixed(1);
    }

    function recalc(f) {
      if (f.predictions_pending || f.prob1 === null || f.prob1 === undefined) {
        return { pending: true, m1: imp(f.odds1)*100, m2: imp(f.odds2)*100 };
      }
      const m1 = imp(f.odds1)*100, m2 = imp(f.odds2)*100;
      const e1 = f.prob1 - m1, e2 = f.prob2 - m2;
      let bet_on = null, bet_odds = null, verdict = 'PASS'; // model not feeling it
      if (e1 >= e2 && e1 > 0) { bet_on = f.fighter1; bet_odds = f.odds1; }
      else if (e2 > 0) { bet_on = f.fighter2; bet_odds = f.odds2; }
      if (f.verdict) { verdict = f.verdict; bet_on = f.bet_on || bet_on; bet_odds = f.bet_odds || bet_odds; }
      else if (bet_on && Math.abs(bet_odds) <= 150) verdict = 'BET';
      else if (bet_on) verdict = 'PASS_CAP';
      return { m1, m2, e1, e2, bet_on, bet_odds, verdict };
    }

    function setStats(bt) {
      if (!bt) return;
      currentBacktest = bt;
      document.getElementById('s-roi').textContent = (bt.roi > 0 ? '+' : '') + bt.roi + '%';
      document.getElementById('s-wr').textContent = bt.win_rate + '%';
      document.getElementById('s-fav').textContent = (bt.fav_roi > 0 ? '+' : '') + bt.fav_roi + '%';
      document.getElementById('s-dog').textContent = (bt.dog_roi > 0 ? '+' : '') + bt.dog_roi + '%';
      document.getElementById('s-bets').textContent = (bt.total_bets || '—') + ' bets · as of ' + (bt.as_of || '');
    }

    async function fetchLiveOdds() {
      try {
        const res = await fetch(
          `${ODDS_API_BASE}/sports/mma_mixed_martial_arts/odds?regions=us&markets=h2h&oddsFormat=american&bookmakers=draftkings&apiKey=${ODDS_API_KEY}`
        );
        if (!res.ok) { console.log('OddsAPI failed:', res.status); return; }
        const games = await res.json();
        if (!games.length) return;
        const map = {};
        games.forEach(game => {
          const dk = (game.bookmakers || []).find(b => b.key === 'draftkings');
          if (!dk) return;
          const market = (dk.markets || []).find(m => m.key === 'h2h');
          if (!market || market.outcomes.length < 2) return;
          const o = market.outcomes;
          const n1 = o[0].name.split(' ').pop().toLowerCase();
          const n2 = o[1].name.split(' ').pop().toLowerCase();
          map[`${n1}|${n2}`] = { o1: o[0].price, o2: o[1].price };
          map[`${n2}|${n1}`] = { o1: o[1].price, o2: o[0].price };
        });
        liveOdds = map;
        if (Object.keys(map).length > 0) {
          document.getElementById('live-badge').style.display = 'inline-flex';
          let updated = 0;
          state.forEach(f => {
            const key = f.fighter1.split(' ').pop().toLowerCase() + '|' + f.fighter2.split(' ').pop().toLowerCase();
            if (liveOdds[key]) { f.odds1 = liveOdds[key].o1; f.odds2 = liveOdds[key].o2; updated++; }
          });
          console.log(`Live odds updated for ${updated} fights`);
        }
      } catch(e) { console.log('OddsAPI unavailable:', e.message); }
    }

    function fightHTML(f, gi) {
      const c = recalc(f);
      const pending = c.pending;
      const p1col = pending ? '#555' : (f.prob1 >= 50 ? '#60a5fa' : '#555');
      const p2col = pending ? '#555' : (f.prob2 >= 50 ? '#60a5fa' : '#555');
      const e1cls = pending ? '' : (c.e1 > 0 ? 'green' : 'red');
      const e2cls = pending ? '' : (c.e2 > 0 ? 'green' : 'red');

      let pill = 'PASS', pillCls = 'pill-pass';
      if (pending) {
        pillCls = 'pill-pending'; pill = 'predictions pending';
      } else if (c.verdict === 'BET') {
        if (c.edge >= 0.25 && c.bet_odds > 200) { pillCls = 'pill-disagree'; pill = 'Disrespected Underdog'; }
        else { pillCls = c.bet_odds < 0 ? 'pill-bet-fav' : 'pill-bet-dog';
        pill = `BET ${c.bet_on.split(' ').pop()} (${oddsStr(c.bet_odds)})`;
      } else if (c.verdict === 'PASS_CAP') {
        pillCls = 'pill-cap'; pill = "Model's intrigued"; // edge but outside capap';
      }

      const prob1Display = pending ? '—' : f.prob1 + '%';
      const prob2Display = pending ? '—' : f.prob2 + '%';
      const barWidth = pending ? 50 : f.prob1;
      const e1Display = pending ? '—' : (c.e1 > 0 ? '+' : '') + c.e1.toFixed(1) + '%';
      const e2Display = pending ? '—' : (c.e2 > 0 ? '+' : '') + c.e2.toFixed(1) + '%';
      const ev1Display = pending ? '—' : evStr(f.prob1, f.odds1);
      const ev2Display = pending ? '—' : evStr(f.prob2, f.odds2);

      return `<div class="fight" id="fight-${gi}">
        <div class="fight-main">
          <div class="fighter">
            <span class="fighter-name">${f.fighter1}</span>
            <span class="fighter-odds" id="d-o1-${gi}">${oddsStr(f.odds1)}</span>
            <span class="fighter-prob-model" style="color:${p1col}">${prob1Display} model</span>
            <span class="fighter-prob-mkt">${c.m1.toFixed(0)}% market</span>
          </div>
          <div class="fight-center">
            <span class="weight-class">${f.weight_class}</span>
            <div class="bar"><div class="bar-fill" style="width:${barWidth}%;background:${p1col}"></div></div>
            <span class="verdict-pill ${pillCls}">${pill}</span>
          </div>
          <div class="fighter right">
            <span class="fighter-name">${f.fighter2}</span>
            <span class="fighter-odds" id="d-o2-${gi}">${oddsStr(f.odds2)}</span>
            <span class="fighter-prob-model" style="color:${p2col}">${prob2Display} model</span>
            <span class="fighter-prob-mkt">${c.m2.toFixed(0)}% market</span>
          </div>
        </div>
        <div class="edge-strip">
          <div class="edge-cell">
            <div class="edge-label">${f.fighter1.split(' ').pop()} edge</div>
            <div class="edge-val ${e1cls}">${e1Display}</div>
          </div>
          <div class="edge-cell">
            <div class="edge-label">${f.fighter1.split(' ').pop()} EV</div>
            <div class="edge-val ${e1cls}">${ev1Display}</div>
          </div>
          <div class="edge-cell">
            <div class="edge-label">${f.fighter2.split(' ').pop()} edge</div>
            <div class="edge-val ${e2cls}">${e2Display}</div>
          </div>
          <div class="edge-cell">
            <div class="edge-label">${f.fighter2.split(' ').pop()} EV</div>
            <div class="edge-val ${e2cls}">${ev2Display}</div>
          </div>
        </div>
        <button class="edit-toggle" onclick="toggleEdit(${gi})">edit odds ↓</button>
        <div class="odds-edit" id="edit-${gi}">
          <label>${f.fighter1.split(' ').pop()}</label>
          <input id="i1-${gi}" value="${oddsStr(f.odds1)}" placeholder="-200" />
          <label>${f.fighter2.split(' ').pop()}</label>
          <input id="i2-${gi}" value="${oddsStr(f.odds2)}" placeholder="+170" />
          <button onclick="applyOdds(${gi})">apply</button>
        </div>
      </div>`;
    }


    function buildParlay() {
      var legs = [];
      state.forEach(function(f) {
        var c = recalc(f);
        if (c.verdict !== 'BET' || !c.bet_on || !c.bet_odds) return;
        var betProb = c.bet_on === f.fighter1 ? f.prob1 : f.prob2;
        if (betProb < 51) return;
        legs.push({ fullName: c.bet_on, odds: c.bet_odds, prob: betProb });
      });
      if (legs.length < 2) return '';
      var parlayDecimal = 1.0, combinedProb = 1.0;
      legs.forEach(function(leg) {
        parlayDecimal *= leg.odds > 0 ? (leg.odds/100+1) : (100/Math.abs(leg.odds)+1);
        combinedProb *= leg.prob/100;
      });
      var pa = parlayDecimal >= 2 ? '+'+Math.round((parlayDecimal-1)*100) : '-'+Math.round(100/(parlayDecimal-1));
      var lh = legs.map(function(l) {
        return '<div class="parlay-leg"><span style="font-weight:600">'+l.fullName+'</span><span style="color:var(--green);font-weight:600">'+oddsStr(l.odds)+'</span></div>';
      }).join('');
      return '<div class="parlay-box"><div class="parlay-title">Parlay of the Week <span class="parlay-tag">HIGH RISK</span></div><div class="parlay-legs">'+lh+'</div><div class="parlay-stats"><div><div class="parlay-stat-label">Legs</div><div class="parlay-stat-val">'+legs.length+'</div></div><div><div class="parlay-stat-label">Parlay odds</div><div class="parlay-stat-val">'+pa+'</div></div><div><div class="parlay-stat-label">Hit prob</div><div class="parlay-stat-val">'+(combinedProb*100).toFixed(1)+'%</div></div></div><div class="parlay-disclaimer">Model-based · not financial advice</div></div>';
    }


    function toggleHowItWorks() {
      var el = document.getElementById('how-it-works');
      var arrow = document.getElementById('hiw-arrow');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
      arrow.textContent = el.style.display === 'none' ? '▼' : '▲';
    }
    function toggleRoiInfo() {
      var el = document.getElementById('roi-info');
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
    var infoCache = {};
    function toggleFightInfo(i) {
      var panel = document.getElementById('info-panel-' + i);
      if (!panel) return;
      if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      if (infoCache[i]) { panel.innerHTML = infoCache[i]; return; }
      var f = state[i];
      panel.innerHTML = '<div style="color:var(--text3);font-size:11px;">Generating analysis...</div>';
      generateFightAnalysis(f, i, panel);
    }
    async function generateFightAnalysis(f, i, panel) {
      var c = recalc(f);
      var betOn = c.bet_on || f.fighter1;
      var opp = c.bet_on === f.fighter1 ? f.fighter2 : f.fighter1;
      var betProb = c.bet_on === f.fighter1 ? f.prob1 : f.prob2;
      var imp1 = f.odds1 < 0 ? Math.abs(f.odds1)/(Math.abs(f.odds1)+100) : 100/(f.odds1+100);
      var imp2 = f.odds2 < 0 ? Math.abs(f.odds2)/(Math.abs(f.odds2)+100) : 100/(f.odds2+100);
      var mktProb = Math.round((c.bet_on === f.fighter1 ? imp1 : imp2) * 100);
      var betOdds = c.bet_odds || 0;
      var sweetSpot = '';
      if (c.verdict === 'DISRESPECTED') {
        var minImplied = betProb/100 - 0.25;
        var minOdds = minImplied > 0 ? Math.round(100/minImplied - 100) : 200;
        sweetSpot = '+' + Math.max(200, minOdds) + ' to +600';
      } else if (c.verdict === 'LOVES' && betOdds < 0) {
        var maxImplied = betProb/100 - 0.04;
        var maxOdds = maxImplied > 0 ? -Math.round(maxImplied/(1-maxImplied)*100) : -200;
        sweetSpot = '-101 to ' + Math.max(-200, maxOdds);
      } else if (c.verdict === 'LOVES') {
        sweetSpot = '+101 to +200';
      }
      try {
        var prompt = 'Write 2-3 sentences analyzing why ' + betOn + ' is interesting against ' + opp + ' in this UFC fight. Focus only on fighter attributes: style, experience, finishing ability, recent form. Do not mention odds or betting.';
        var resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 200, messages: [{ role: 'user', content: prompt }] })
        });
        var data = await resp.json();
        var analysis = data.content && data.content[0] ? data.content[0].text : 'Analysis unavailable.';
        var openOdds = betOdds > 0 ? '+' + betOdds : betOdds;
        var bottom = 'Based on opening odds of ' + openOdds + ' — model gives ' + betOn + ' ' + betProb + '% vs market\'s ' + mktProb + '%.';
        if (sweetSpot) bottom += ' Model ' + (c.verdict === 'DISRESPECTED' ? 'loves' : 'likes') + ' this between ' + sweetSpot + '.';
        var html = '<div>' + analysis + '</div><div class="fight-info-bottom">' + bottom + '</div>';
        infoCache[i] = html;
        panel.innerHTML = html;
      } catch(e) {
        panel.innerHTML = '<div style="color:var(--text3)">Analysis unavailable.</div>';
      }
    }
    function drawCard() {
      const root = document.getElementById('root');
      const main = state.filter(f => f.main_card !== false);
      const pre  = state.filter(f => f.main_card === false);
      let bets = state.filter(f => recalc(f).verdict === 'BET').length;
      const isPending = state.some(f => f.predictions_pending || f.prob1 === null || f.prob1 === undefined);

      let html = `<div class="event-header">
        <span class="event-name">${currentEvent}</span>
        <span class="event-meta">${currentDate}</span>
      </div>`;

      if (isPending) {
        html += `<div class="pending-banner">
          ⚠ <span><strong>Model predictions pending.</strong> Odds are live but model probabilities haven't been run yet. Run <code>weekly_update.bat</code> to generate predictions.</span>
        </div>`;
      }

      if (main.length > 0) {
        html += `<div class="card"><div class="section-label">Main card</div>`;
        main.forEach(f => { html += fightHTML(f, state.indexOf(f)); });
        html += `</div>`;
      }
      if (pre.length > 0) {
        html += `<div class="card"><div class="section-label">Prelims</div>`;
        pre.forEach(f => { html += fightHTML(f, state.indexOf(f)); });
        html += `</div>`;
      }

      html += `<div class="footer-note">
        <strong>${bets} bet${bets !== 1 ? 's' : ''} flagged</strong> flagged this card (>=4% edge) ·
        ${currentBacktest.total_bets || 148} historical bets in backtest ·
        click <em>edit odds</em> on any fight to enter your own lines
      </div>`;

      var ph = buildParlay(); if (ph) html += ph;
      root.innerHTML = html;
    }

    function toggleEdit(i) { document.getElementById(`edit-${i}`).classList.toggle('open'); }

    function applyOdds(i) {
      const o1 = parseFloat(document.getElementById(`i1-${i}`).value);
      const o2 = parseFloat(document.getElementById(`i2-${i}`).value);
      if (!isNaN(o1)) state[i].odds1 = o1;
      if (!isNaN(o2)) state[i].odds2 = o2;
      drawCard();
      document.getElementById(`edit-${i}`).classList.add('open');
    }

    async function loadPredictions() {
      try {
        const r = await fetch(PREDICTIONS_URL + '?v=' + Date.now());
        const data = await r.json();
        const ev = Array.isArray(data) ? data[0] : data;
        currentEvent = ev.event || 'UFC Event';
        currentDate = ev.date || '';
        state = (ev.bouts || []).map(b => ({...b}));
        setStats(ev.backtest);
      } catch(e) {
        console.log('Predictions not found, using defaults');
        loadDefaults();
      }
    }

    async function loadAll() {
      document.getElementById('root').innerHTML = '<div class="loading"><span class="dot">●</span> <span class="dot">●</span> <span class="dot">●</span><br><br>Refreshing...</div>';

      await fetchLiveOdds();
