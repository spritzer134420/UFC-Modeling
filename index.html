function getStyleMatchupScore(stylesA, stylesB) {
  let total = 0, count = 0;
  for (const sa of stylesA) {
    const row = styleMatrix[sa];
    if (!row) continue;
    for (const sb of stylesB) {
      if (row[sb] !== undefined) { total += row[sb]; count++; }
    }
  }
  return count > 0 ? total / count : 0.5;
}

// ─── MODELS ──────────────────────────────────────────────────────────────────
function modelWeighted(f1n, f2n) {
  const a = fighters[f1n], b = fighters[f2n];
  if (!a || !b) return 0.5;
  const div = a.division === b.division ? a.division : "default";
  const w = divisionWeights[div] || divisionWeights.default;
  let s = 0;
  s += (a.stats.slpm * a.stats.strAcc/100 - b.stats.slpm * b.stats.strAcc/100) * w.striking;
  s += (a.stats.strDef - b.stats.strDef) * w.strikeDef;
  s += (a.stats.tdAvg * a.stats.tdAcc/100 - b.stats.tdAvg * b.stats.tdAcc/100) * w.grappling;
  s += (a.stats.tdDef - b.stats.tdDef) * w.tdDef;
  s += (a.stats.subAvg - b.stats.subAvg) * w.sub;
  s += (a.age > 33 ? -(a.age-33)*w.age : 0) - (b.age > 33 ? -(b.age-33)*w.age : 0);
  const fa = a.recentForm.reduce((x,v)=>x+v,0)/a.recentForm.length;
  const fb = b.recentForm.reduce((x,v)=>x+v,0)/b.recentForm.length;
  s += (fa - fb) * w.form;
  s += (getStyleMatchupScore(a.style, b.style) - 0.5) * w.style * 4;
  s += (a.sos - b.sos) * w.sos * 0.05;
  return Math.min(0.95, Math.max(0.05, 1/(1+Math.exp(-s*3.5))));
}

function modelElo(f1n, f2n) {
  const a = fighters[f1n], b = fighters[f2n];
  if (!a || !b) return 0.5;
  function rating(f) {
    const [w,l] = f.record.split("-").map(Number);
    const wr = w/(w+l);
    const form = f.recentForm.reduce((x,v)=>x+v,0)/f.recentForm.length;
    const base = 1400 + (wr-0.5)*600 + (f.sos-5)*30 + form*80 + (f.stats.koRate+f.stats.subRate)*30;
    return base + (f.age > 34 ? -(f.age-34)*12 : 0);
  }
  return Math.min(0.95, Math.max(0.05, 1/(1+Math.pow(10,(rating(b)-rating(a))/400))));
}

function modelMatchup(f1n, f2n) {
  const a = fighters[f1n], b = fighters[f2n];
  if (!a || !b) return 0.5;
  const styleScore = getStyleMatchupScore(a.style, b.style);
  const sosEdge = (a.sos - b.sos)/20;
  const reachEdge = (a.reach - b.reach)/200;
  const fa = a.recentForm.reduce((x,v)=>x+v,0)/a.recentForm.length;
  const fb = b.recentForm.reduce((x,v)=>x+v,0)/b.recentForm.length;
  const formEdge = (fa - fb)*0.15;
  const ageEdge = (a.age>33?-(a.age-33)*0.01:0) - (b.age>33?-(b.age-33)*0.01:0);
  const strM = (a.stats.strAcc/100)*(1-b.stats.strDef/100) - (b.stats.strAcc/100)*(1-a.stats.strDef/100);
  const tdM  = (a.stats.tdAcc/100)*(1-b.stats.tdDef/100)  - (b.stats.tdAcc/100)*(1-a.stats.tdDef/100);
  const raw = styleScore + sosEdge + reachEdge + formEdge + ageEdge + strM*0.3 + tdM*0.25;
  return Math.min(0.95, Math.max(0.05, raw));
}

function modelEnsemble(f1, f2) {
  return (modelWeighted(f1,f2) + modelElo(f1,f2) + modelMatchup(f1,f2) + modelXGB(f1,f2)) / 4;
}

// Build feature vector from two fighters in the same format as Python pipeline
function buildXGBFeatures(f1n, f2n) {
  const a = fighters[f1n], b = fighters[f2n];
  if (!a || !b) return null;

  const fa = a.recentForm.reduce((x,v)=>x+v,0)/a.recentForm.length;
  const fb = b.recentForm.reduce((x,v)=>x+v,0)/b.recentForm.length;
  const [aw,al] = a.record.split("-").map(Number);
  const [bw,bl] = b.record.split("-").map(Number);
  const a_wr = aw/(aw+al), b_wr = bw/(bw+bl);

  // Simulated Elo from record + SOS + form (mirrors Python modelElo)
  function simElo(f) {
    const [w,l] = f.record.split("-").map(Number);
    const wr = w/(w+l);
    const form = f.recentForm.reduce((x,v)=>x+v,0)/f.recentForm.length;
    return 1400 + (wr-0.5)*600 + (f.sos-5)*30 + form*80
           + (f.stats.koRate+f.stats.subRate)*30
           + (f.age > 34 ? -(f.age-34)*12 : 0);
  }
  const a_elo = simElo(a), b_elo = simElo(b);

  // Recent KO loss — proxy: check if recentForm last loss was flagged
  const a_ko_loss = a.stats.koRate > 0.4 && fa < 0.6 ? 1 : 0;
  const b_ko_loss = b.stats.koRate > 0.4 && fb < 0.6 ? 1 : 0;

  // Days off proxy (fighters with recent inactivity)
  const a_days = 90, b_days = 90; // default — real value from scrape

  const stance_map = {"Orthodox":0,"Southpaw":1,"Switch":2};
  const a_st = stance_map[a.stance]||0, b_st = stance_map[b.stance]||0;

  const now_year = 2026;

  return {
    "elo_diff":          a_elo - b_elo,
    "age_diff":          a.age - b.age,
    "reach_diff":        a.reach - b.reach,
    "height_diff":       a.height - b.height,
    "southpaw_adv":      a_st !== b_st ? 1 : 0,
    "f1_age":            a.age,
    "f2_age":            b.age,
    "f1_avg_sig_str":    a.stats.slpm,
    "f2_avg_sig_str":    b.stats.slpm,
    "f1_avg_sig_acc":    a.stats.strAcc/100,
    "f2_avg_sig_acc":    b.stats.strAcc/100,
    "f1_avg_str_def":    a.stats.strDef/100,
    "f2_avg_str_def":    b.stats.strDef/100,
    "f1_avg_td":         a.stats.tdAvg,
    "f2_avg_td":         b.stats.tdAvg,
    "f1_avg_td_def":     a.stats.tdDef/100,
    "f2_avg_td_def":     b.stats.tdDef/100,
    "f1_sub_rate":       a.stats.subRate,
    "f2_sub_rate":       b.stats.subRate,
    "f1_ko_rate":        a.stats.koRate,
    "f2_ko_rate":        b.stats.koRate,
    "f1_recent_ko_loss": a_ko_loss,
    "f2_recent_ko_loss": b_ko_loss,
    "f1_days_off":       a_days,
    "f2_days_off":       b_days,
    "diff_sig_str":      a.stats.slpm - b.stats.slpm,
    "diff_sig_acc":      (a.stats.strAcc - b.stats.strAcc)/100,
    "diff_str_def":      (a.stats.strDef - b.stats.strDef)/100,
    "diff_td":           a.stats.tdAvg - b.stats.tdAvg,
    "diff_td_def":       (a.stats.tdDef - b.stats.tdDef)/100,
    "diff_sub_rate":     a.stats.subRate - b.stats.subRate,
    "diff_ko_rate":      a.stats.koRate - b.stats.koRate,
    "diff_finish_rate":  (a.stats.koRate+a.stats.subRate) - (b.stats.koRate+b.stats.subRate),
    "diff_streak":       (fa>0.8?2:fa>0.6?1:fa<0.4?-1:-2) - (fb>0.8?2:fb>0.6?1:fb<0.4?-1:-2),
    "diff_win_rate":     a_wr - b_wr,
    "diff_days_off":     a_days - b_days,
    "diff_ctrl_sec":     0,
    "diff_kd":           0,
    "diff_sub_att":      a.stats.subAvg - b.stats.subAvg,
    "str_penetration":   (a.stats.strAcc/100)*(1-b.stats.strDef/100),
    "modern_era":        1,

    "years_ago":         0,
    "modern_x_elo_diff": a_elo - b_elo,
    "height_diff":       a.height - b.height,
  };
}

function modelXGB(f1n, f2n) {
  const feats = buildXGBFeatures(f1n, f2n);
  if (!feats) return 0.5;

  // Weighted dot product of feature values × importance weights
  // Sign-aware: positive features favor f1, negative favor f2
  let score = 0;
  let totalWeight = 0;
  for (const [feat, weight] of Object.entries(XGB_WEIGHTS)) {
    const val = feats[feat];
    if (val !== undefined && !isNaN(val)) {
      score += val * weight;
      totalWeight += weight;
    }
  }

  // Normalize by total weight, then scale and sigmoid
  const normalized = totalWeight > 0 ? score / totalWeight : 0;
  const prob = 1 / (1 + Math.exp(-normalized * 8));
  return Math.min(0.95, Math.max(0.05, prob));
}

// ─── MATH HELPERS ─────────────────────────────────────────────────────────────
function oddsToRawProb(o) { return o < 0 ? (-o)/(-o+100) : 100/(o+100); }
function vigFreeProbs(o1,o2) { const r1=oddsToRawProb(o1),r2=oddsToRawProb(o2),t=r1+r2; return [r1/t,r2/t]; }
function calcVig(o1,o2) { return ((oddsToRawProb(o1)+oddsToRawProb(o2)-1)*100).toFixed(1); }
function probToOdds(p) { return p>=0.5 ? Math.round(-p/(1-p)*100) : Math.round((1-p)/p*100); }
function calcEV(modelProb, marketOdds) {
  const payout = marketOdds>0 ? marketOdds/100 : 100/Math.abs(marketOdds);
  return (modelProb*payout - (1-modelProb)) * 100;
}

function kellyFraction(modelProb, marketOdds) {
  const b = marketOdds > 0 ? marketOdds/100 : 100/Math.abs(marketOdds);
  const q = 1 - modelProb;
  const k = (b * modelProb - q) / b;
  return Math.max(0, Math.min(k, 0.25)); // cap at 25%
}

function kellyBet(modelProb, marketOdds, bankroll, fraction=0.5) {
  // Half-Kelly is standard — reduces variance
  const full = kellyFraction(modelProb, marketOdds);
  return Math.round(full * fraction * bankroll);
}

function getEdgeState(modelProb, marketProb, marketOdds, vig) {
  const edge = (modelProb - marketProb)*100;
  const ev = calcEV(modelProb, marketOdds);
  if (edge <= 0) return { type:"none", edge, ev, label:"NO EDGE" };
  if (ev > 0)    return { type:"profitable", edge, ev, label: edge>=15?"STRONG":edge>=8?"MODERATE":"SLIGHT" };
  return { type:"divergence", edge, ev, label:"DIVERGE" };
}

  "none|NO EDGE":        { color:"#2a2a2a", bg:"transparent",            border:"#1e1e1e",               glow:"none" },
};
function getStateStyle(s) { return STATE_STYLES[`${s.type}|${s.label}`] || STATE_STYLES["none|NO EDGE"]; }

// ─── COMPONENTS ───────────────────────────────────────────────────────────────
function EdgeCell({ modelProb, marketProb, marketOdds, vig }) {
  const state = getEdgeState(modelProb, marketProb, marketOdds, vig);
  const st = getStateStyle(state);
  if (state.type === "none") return <span style={{ color:"#252525", fontSize:10, fontWeight:700 }}>NO EDGE</span>;
  const evSign = state.ev >= 0 ? "+" : "";
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
      <div style={{ display:"flex", alignItems:"center", gap:5 }}>
        <span style={{ background:st.bg, color:st.color, border:`1px solid ${st.border}`, borderRadius:4, padding:"2px 7px", fontSize:10, fontWeight:800, letterSpacing:"0.08em", boxShadow:st.glow, minWidth:58, textAlign:"center" }}>{state.label}</span>
        <span style={{ fontSize:11, fontWeight:700, color:st.color }}>+{state.edge.toFixed(1)}%</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:5 }}>
        <span style={{ fontSize:10, fontWeight:700, color: state.ev>0?"#00ff88":"#7eb8ff" }}>EV {evSign}{state.ev.toFixed(0)}¢</span>
        {state.type==="divergence" && <span style={{ fontSize:9, color:"#333" }}>vig eats edge</span>}
      </div>
    </div>
  );
}

function StatBar({ label, valA, valB, suffix="" }) {
  const max = Math.max(valA, valB)*1.2||1;
  const winA = valA >= valB;
  return (
    <div style={{ marginBottom:9 }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
        <span style={{ color:winA?"#00ff88":"#555", fontSize:11, fontWeight:winA?700:400 }}>{valA}{suffix}</span>
        <span style={{ color:"#333", fontSize:10, textTransform:"uppercase", letterSpacing:"0.07em" }}>{label}</span>
        <span style={{ color:!winA?"#00ff88":"#555", fontSize:11, fontWeight:!winA?700:400 }}>{valB}{suffix}</span>
      </div>
      <div style={{ display:"flex", gap:3 }}>
        <div style={{ flex:1, height:3, background:"#161616", borderRadius:2, overflow:"hidden", transform:"scaleX(-1)" }}>
          <div style={{ height:"100%", width:`${(valA/max)*100}%`, background:winA?"#00ff88":"#222", borderRadius:2 }} />
        </div>
        <div style={{ flex:1, height:3, background:"#161616", borderRadius:2, overflow:"hidden" }}>
          <div style={{ height:"100%", width:`${(valB/max)*100}%`, background:!winA?"#00ff88":"#222", borderRadius:2 }} />
        </div>
      </div>
    </div>
  );
}

function StyleTag({ label }) {
  return <span style={{ background:"rgba(255,180,0,0.06)", color:"#996600", border:"1px solid rgba(255,180,0,0.12)", borderRadius:3, padding:"1px 6px", fontSize:9, fontWeight:700, letterSpacing:"0.06em", textTransform:"uppercase" }}>{label}</span>;
}

function ModelAgreement({ f1, f2 }) {
  const probs = Object.entries(MODELS).map(([k,m])=>({ k, label:m.label, prob:m.fn(f1,f2) }));
  const spread = Math.max(...probs.map(p=>p.prob)) - Math.min(...probs.map(p=>p.prob));
  const [ag, agCol] = spread<0.08 ? ["HIGH","#00ff88"] : spread<0.16 ? ["MEDIUM","#ffe44d"] : ["LOW","#ff6644"];
  return (
    <div style={{ background:"#111", borderRadius:8, padding:16, marginBottom:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
        <span style={{ color:"#333", fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase" }}>Model Agreement</span>
        <span style={{ color:agCol, fontSize:10, fontWeight:800 }}>{ag}</span>
      </div>
      {probs.map(({k,label,prob})=>(
        <div key={k} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
          <span style={{ fontSize:10, color:"#444", width:112, flexShrink:0 }}>{label}</span>
          <div style={{ flex:1, height:3, background:"#1a1a1a", borderRadius:2, overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${prob*100}%`, background:"#7df", borderRadius:2 }} />
          </div>
          <span style={{ fontSize:11, fontWeight:700, color:"#7df", width:32, textAlign:"right" }}>{(prob*100).toFixed(0)}%</span>
        </div>
      ))}
    </div>
  );
}

function MatchupBreakdown({ f1n, f2n }) {
  const a = fighters[f1n], b = fighters[f2n];
  if (!a||!b) return null;
  const styleScore = getStyleMatchupScore(a.style, b.style);
  const strM = ((a.stats.strAcc/100)*(1-b.stats.strDef/100) - (b.stats.strAcc/100)*(1-a.stats.strDef/100))*100;
  const tdM  = ((a.stats.tdAcc/100)*(1-b.stats.tdDef/100)  - (b.stats.tdAcc/100)*(1-a.stats.tdDef/100))*100;
  const factors = [
    { label:"Style Matchup",      val:(styleScore-0.5)*100, suffix:"%" },
    { label:"Strike Penetration", val:strM,                  suffix:"%" },
    { label:"TD Penetration",     val:tdM,                   suffix:"%" },
    { label:"Reach Advantage",    val:a.reach-b.reach,       suffix:'"' },
    { label:"SOS Edge",           val:(a.sos-b.sos)*5,       suffix:"" },
    { label:"Age Edge",           val:(b.age-a.age)*1.5,     suffix:"" },
  ];
  return (
    <div style={{ background:"#111", borderRadius:8, padding:16, marginBottom:12 }}>
      <div style={{ color:"#333", fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:10 }}>
        Matchup Factors — <span style={{ color:"#00ff88" }}>{f1n.split(" ").pop()}</span> perspective
      </div>
      {factors.map(({label,val,suffix})=>{
        const col = val>0?"#00ff88":val<0?"#ff6644":"#333";
        const bw = Math.min(Math.abs(val)*3,50);
        return (
          <div key={label} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
            <span style={{ fontSize:10, color:"#444", width:130, flexShrink:0 }}>{label}</span>
            <div style={{ flex:1, height:3, background:"#1a1a1a", borderRadius:2, position:"relative" }}>
              <div style={{ position:"absolute", left:"50%", top:0, width:1, height:"100%", background:"#2a2a2a" }} />
              <div style={{ position:"absolute", height:"100%", width:`${bw}%`, background:col, borderRadius:2, left:val>=0?"50%":`${50-bw}%` }} />
            </div>
            <span style={{ fontSize:11, fontWeight:700, color:col, width:44, textAlign:"right" }}>{val>0?"+":""}{val.toFixed(1)}{suffix}</span>
          </div>
        );
      })}
    </div>
  );
}

function BoutRow({ bout, onSelect, modelKey, showKelly, bankroll }) {
  const { fighter1, fighter2, odds1, odds2, event, date, title } = bout;
  const fn = MODELS[modelKey]?.fn || modelEnsemble;
  const mp1 = fn(fighter1,fighter2), mp2 = 1-mp1;
  const [mkt1,mkt2] = vigFreeProbs(odds1,odds2);
  const vig = calcVig(odds1,odds2);
  const s1 = getEdgeState(mp1,mkt1,odds1,vig), s2 = getEdgeState(mp2,mkt2,odds2,vig);
  const top = s1.ev > s2.ev ? s1 : s2;
  const topSt = getStateStyle(top);
  const [hov, setHov] = useState(false);
  const k1 = showKelly ? kellyBet(mp1, odds1, bankroll) : null;
  const k2 = showKelly ? kellyBet(mp2, odds2, bankroll) : null;
  return (
    <div onClick={()=>onSelect(bout)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ background:hov?"#0f0f0f":"#0a0a0a", border:`1px solid ${hov?"#1e1e1e":"#141414"}`, borderRadius:8, cursor:"pointer", transition:"all 0.15s", marginBottom:8, overflow:"hidden" }}>
      {top.type!=="none"&&<div style={{ height:2, background:topSt.color, opacity:0.45, width:`${Math.min(Math.abs(top.edge)*5,100)}%` }}/>}
      <div style={{ padding:"14px 18px", display:"grid", gridTemplateColumns:"1fr auto 1fr", gap:12, alignItems:"center" }}>
        <div>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:5 }}>
            <span style={{ fontSize:14, fontWeight:800, color:"#fff", fontFamily:"'Bebas Neue',sans-serif", letterSpacing:"0.04em" }}>{fighter1}</span>
            {title&&<span style={{ fontSize:8, color:"#cc8800", border:"1px solid rgba(255,180,0,0.2)", borderRadius:3, padding:"1px 4px" }}>TITLE</span>}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
            <span style={{ fontSize:13, fontWeight:700, color:"#888" }}>{odds1>0?`+${odds1}`:odds1}</span>
            <span style={{ color:"#222", fontSize:9 }}>→</span>
            <span style={{ fontSize:12, fontWeight:700, color:"#7df" }}>{probToOdds(mp1)>0?`+${probToOdds(mp1)}`:probToOdds(mp1)}</span>
          </div>
          <EdgeCell modelProb={mp1} marketProb={mkt1} marketOdds={odds1} vig={vig}/>
          {showKelly && k1 > 0 && (
            <div style={{ marginTop:4, fontSize:10, color:"#00ff88", fontWeight:700 }}>
              Kelly: ${k1} <span style={{ color:"#333", fontWeight:400 }}>½Kelly</span>
            </div>
          )}
        </div>
        <div style={{ textAlign:"center", padding:"0 4px" }}>
          <div style={{ color:"#1e1e1e", fontWeight:900, fontSize:10 }}>VS</div>
          <div style={{ color:"#252525", fontSize:9, marginTop:3 }}>{event}</div>
          <div style={{ color:"#1e1e1e", fontSize:9 }}>{date}</div>
          <div style={{ color:"#252525", fontSize:9, marginTop:3 }}>VIG {vig}%</div>
          <div style={{ color:"#2a2a2a", fontSize:12, marginTop:4 }}>›</div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:14, fontWeight:800, color:"#fff", fontFamily:"'Bebas Neue',sans-serif", letterSpacing:"0.04em", marginBottom:5 }}>{fighter2}</div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, justifyContent:"flex-end" }}>
            <span style={{ fontSize:12, fontWeight:700, color:"#7df" }}>{probToOdds(mp2)>0?`+${probToOdds(mp2)}`:probToOdds(mp2)}</span>
            <span style={{ color:"#222", fontSize:9 }}>←</span>
            <span style={{ fontSize:13, fontWeight:700, color:"#888" }}>{odds2>0?`+${odds2}`:odds2}</span>

          <div style={{ display:"flex", justifyContent:"flex-end" }}>
            <EdgeCell modelProb={mp2} marketProb={mkt2} marketOdds={odds2} vig={vig}/>
          </div>
          {showKelly && k2 > 0 && (
            <div style={{ marginTop:4, fontSize:10, color:"#00ff88", fontWeight:700, textAlign:"right" }}>
              Kelly: ${k2} <span style={{ color:"#333", fontWeight:400 }}>½Kelly</span>

    </div>

}

                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:16, fontWeight:900, color: m.verdict==="✓ ACTIVE"?"#00ff88": m.verdict==="✗ WORST"?"#ff4455":"#444", fontFamily:"'Bebas Neue',sans-serif" }}>{m.acc}%</div>
                      <div style={{ fontSize:8, color: m.verdict==="✓ ACTIVE"?"#336633": m.verdict==="✗ WORST"?"#662222":"#222" }}>{m.verdict}</div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Top features */}
              <div>
                <div style={{ fontSize:9, color:"#333", letterSpacing:"0.08em", marginBottom:10 }}>TOP FEATURES — XGB SHAP IMPORTANCE</div>
                {features.map((f,i)=>(
                  <div key={i} style={{ marginBottom:6 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:2 }}>
                      <span style={{ fontSize:10, color:"#444" }}>{f.name}</span>
                      <span style={{ fontSize:9, color:"#333" }}>{f.imp}</span>
                    </div>
                    <div style={{ height:3, background:"#111", borderRadius:2 }}>
                      <div style={{ height:"100%", width:`${f.imp}%`, background:"linear-gradient(90deg,#00ff88,#007744)", borderRadius:2 }}/>
                    </div>
                  </div>
                ))}
                <div style={{ fontSize:8, color:"#1a1a1a", marginTop:10 }}>
                  91 features total · Era-filtered training (excl 2002-2013, 2019-2022) · 1,618 clean fights
                </div>
              </div>
            </div>
          );
        })()}

        {tab==="legend"&&(
          <div>
            <div style={{ fontSize:10, color:"#333", marginBottom:18 }}>Signal guide · EV per $100 after vig</div>
            {[
              { label:"STRONG",   color:"#00ff88", desc:"Edge beats vig — positive EV. Model strongly disagrees with market. Best signal." },
              { label:"MODERATE", color:"#ffe44d", desc:"Edge beats vig — positive EV. Meaningful divergence worth acting on." },
              { label:"SLIGHT",   color:"#ffb347", desc:"Barely beats vig — thin positive EV. Look for corroborating factors." },
              { label:"DIVERGE",  color:"#7eb8ff", desc:"Model disagrees but edge doesn't cover vig. Informational only — not a bet signal." },
              { label:"NO EDGE",  color:"#2a2a2a", desc:"Model agrees with market or market favors fighter more than model does." },
            ].map(({label,color,desc})=>(
              <div key={label} style={{ background:"#0a0a0a", border:"1px solid #141414", borderRadius:8, padding:"14px 16px", marginBottom:7, display:"flex", gap:12, alignItems:"flex-start" }}>
                <span style={{ color, border:`1px solid ${color}33`, borderRadius:4, padding:"3px 8px", fontSize:10, fontWeight:800, letterSpacing:"0.08em", flexShrink:0, minWidth:60, textAlign:"center" }}>{label}</span>
                <span style={{ fontSize:11, color:"#444", lineHeight:1.6 }}>{desc}</span>
              </div>
            ))}
            <div style={{ marginTop:16, background:"#0a0a0a", border:"1px solid #141414", borderRadius:8, padding:16 }}>
              <div style={{ color:"#252525", fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:10 }}>Models</div>
              {Object.entries(MODELS).map(([k,m])=>(
                <div key={k} style={{ display:"flex", gap:10, marginBottom:7 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:"#7df", width:120, flexShrink:0 }}>{m.label}</span>
                  <span style={{ fontSize:11, color:"#3a3a3a" }}>{m.desc}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop:10, background:"#0a0a0a", border:"1px solid #141414", borderRadius:8, padding:16 }}>
              <div style={{ color:"#252525", fontSize:10, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:10 }}>Math</div>
              <div style={{ fontSize:11, color:"#3a3a3a", lineHeight:2.2 }}>
                <div><span style={{ color:"#444" }}>Edge %</span> = model win prob − vig-free market implied prob</div>
                <div><span style={{ color:"#444" }}>EV</span> = (model prob × payout − loss) × 100, per $100 bet</div>
                <div><span style={{ color:"#444" }}>Vig</span> = sum of raw implied probs − 1 (book's margin)</div>
                <div><span style={{ color:"#444" }}>DIVERGE</span> = edge exists but EV negative after vig cost</div>
              </div>
            </div>
          </div>
        )}
      </div>

      {selected&&<MatchupModal bout={selected} onClose={()=>setSelected(null)} modelKey={modelKey}/>}
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"/>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UFCEdgeAnalyzer />);
  </script>
</body>
</html>
